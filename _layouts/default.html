<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.title and page.title != site.title %}
  <title>{{ page.title }} · {{ site.author }}</title>
  {% else %}
  <title>{{ site.title }} · {{ site.author }}</title>
  {% endif %}
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1d23;
      --muted: #5f6672;
      --line: #e6e8ec;
      --accent: #3b4fa8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111316;
        --text: #e8e9ec;
        --muted: #9aa0aa;
        --line: #2a2d33;
        --accent: #8fa2f0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.65 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 72px 20px 96px;
    }
    h1 {
      font-size: 2.4rem;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin: 0 0 0.6rem;
    }
    h2 {
      font-size: 1.1rem;
      margin: 2.8rem 0 0.8rem;
    }
    p, ul, ol { margin: 0 0 1rem; }
    li { margin-bottom: 0.35rem; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { text-decoration-thickness: 2px; }
    strong { font-weight: 600; }
    img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.8rem 0;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    hr { border: 0; border-top: 1px solid var(--line); margin: 3rem 0 1.2rem; }
    code { font: 0.9em "JetBrains Mono", ui-monospace, monospace; }
    table { width: 100%; border-collapse: collapse; margin: 2rem 0; font-size: 0.95rem; }
    th { text-align: left; font-weight: 600; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    th, td { padding: 0.7rem 0.8rem 0.7rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    td:first-child { color: var(--muted); white-space: nowrap; }
    footer { margin-top: 4rem; color: var(--muted); font-size: 0.85rem; }
    @media (max-width: 560px) {
      main { padding: 40px 16px 64px; }
      h1 { font-size: 1.9rem; }
      th:nth-child(3), td:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>
  <main>
    {{ content }}
    <footer>© {{ site.time | date: "%Y" }} {{ site.author }}</footer>
  </main>
</body>
</html>
